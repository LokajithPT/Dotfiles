background {
    monitor =
    path = /home/skedaddle/Pictures/arch.png
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 4
    blur_size = 12
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M %p")"
    color = rgba(255, 255, 255, 0.9)
    font_size = 130
    font_family = JetBrains Mono Nerd Font ExtraBold
    position = 0, -300
    halign = center
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = rgba(255, 255, 255, 0.5)
    font_size = 20
    font_family = JetBrains Mono Nerd Font
    position = 0, -170
    halign = center
    valign = top
}

# USER
label {
    monitor =
    text = Hey $USER
    color = rgba(255, 255, 255, 0.7)
    font_size = 28
    font_family = JetBrains Mono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 0
    dots_size = 0.35
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.08)
    font_color = rgb(255, 255, 255)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -110
    halign = center
    valign = center
}
